description: AliciaBots is a maritime robotics company, backed by Techstars, that builds
  autonomous robot teams for cleaning and inspecting ship hulls. Its flagship Roverclean
  robot operates independently to remove marine growth and monitor hull condition in
  real time without interrupting a vessel's voyage, using self-learning adaptive systems,
  precision cleaning, and remote monitoring and control to improve fuel efficiency and
  help operators meet IMO regulatory standards. AliciaBots does not currently publish a
  public API or developer program; this profile tracks the company as a network lead.
